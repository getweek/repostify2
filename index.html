<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repostify - YouTube Content Scheduler & Upload Manager</title>
    <meta name="description" content="Schedule and manage YouTube video uploads from your Android device. 100% on-device processing, completely private. Your personal YouTube upload assistant." />

    <meta property="og:type" content="website" />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://repostify.xyz" />
    <meta property="twitter:title" content="Repostify - YouTube Content Scheduler" />

    <meta property="twitter:image" content="https://repostify.xyz/og-image.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://repostify.xyz" />
    
    <!-- Structured Data - Software Application -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

        "ratingValue": "4.8",

      },
      "description": "Schedule and manage YouTube video uploads from your Android device. 100% on-device processing.",

      "downloadUrl": "https://github.com/getweek/repostify2/releases/download/v1.0/Repostify-v1.0.apk"
    }
    </script>
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Repostify",
      "url": "https://repostify.xyz",
